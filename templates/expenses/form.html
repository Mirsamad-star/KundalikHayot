{% extends "base.html" %}
{% block title %}{{ action }} Record{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto">
  <h1 class="mb-2">{{ action }} Record</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group"><label>Title *</label><input type="text" name="title" class="form-control" value="{{ expense.title|default:'' }}" required></div>
    <div class="form-group"><label>Amount *</label><input type="number" name="amount" class="form-control" step="0.01" min="0" value="{{ expense.amount|default:'' }}" required></div>
    <div class="form-group"><label>Type</label>
      <select name="type" class="form-control">
        <option value="expense" {% if expense.type == 'expense' or not expense %}selected{% endif %}>Expense</option>
        <option value="income" {% if expense.type == 'income' %}selected{% endif %}>Income</option>
      </select>
    </div>
    <div class="form-group"><label>Category</label>
      <select name="category" class="form-control">
        <option value="">— None —</option>
        {% for c in categories %}
        <option value="{{ c.pk }}" {% if expense.category_id == c.pk %}selected{% endif %}>{{ c.icon }} {{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group"><label>Date *</label><input type="date" name="date" class="form-control" value="{{ expense.date|date:'Y-m-d'|default:'' }}" required></div>
    <div class="form-group"><label>Notes</label><textarea name="notes" class="form-control">{{ expense.notes|default:'' }}</textarea></div>
    <div class="form-group"><label>Receipt</label><input type="file" name="receipt" class="form-control" accept="image/*"></div>
    <div class="flex-between">
      <a href="{% url 'expense_list' %}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
