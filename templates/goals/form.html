{% extends "base.html" %}
{% block title %}{{ action }} Goal{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:0 auto">
  <h1 class="mb-2">{{ action }} Goal</h1>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group"><label>Title *</label><input type="text" name="title" class="form-control" value="{{ goal.title|default:'' }}" required></div>
    <div class="form-group"><label>Description</label><textarea name="description" class="form-control">{{ goal.description|default:'' }}</textarea></div>
    <div class="form-group"><label>Target Date</label><input type="date" name="target_date" class="form-control" value="{{ goal.target_date|date:'Y-m-d'|default:'' }}"></div>
    <div class="form-group"><label>Status</label>
      <select name="status" class="form-control">
        <option value="active" {% if goal.status == 'active' or not goal %}selected{% endif %}>Active</option>
        <option value="completed" {% if goal.status == 'completed' %}selected{% endif %}>Completed</option>
        <option value="abandoned" {% if goal.status == 'abandoned' %}selected{% endif %}>Abandoned</option>
      </select>
    </div>
    <div class="form-group"><label>Progress (0-100)</label><input type="number" name="progress" class="form-control" min="0" max="100" value="{{ goal.progress|default:0 }}"></div>
    <div class="form-group"><label>Image</label><input type="file" name="image" class="form-control" accept="image/*"></div>
    <div class="flex-between">
      <a href="{% url 'goal_list' %}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
